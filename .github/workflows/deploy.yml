# ============================================================
# Deploy — 部署 dev / prod
#
#   觸發方式：
#     push 到 main            → 自動部署 dev
#     手動 Run workflow       → 選 dev 或 prod；prod 可勾選「演練模式」（套用 drill.tfvars）
#
#   job 1 infra：terraform apply（架構有變就更新，沒變就什麼都不做）
#   job 2 app  ：build image → push ECR → ECS 重新部署 → 健康檢查
#
# ⚠️ 成本提醒：dev 已 destroy 的狀態下，只要合併進 main 的 commit 改到
#   terraform/、app/ 或本檔，就會把 dev 建回來並開始計費。只改文件不會觸發。
# ============================================================

name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "terraform/environments/**"
      - "terraform/modules/**"
      - "app/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "部署到哪個環境"
        type: choice
        options: [dev, prod]
        default: dev
      drill:
        description: "prod 演練模式（套用 drill.tfvars：關閉刪除保護，演練後可立即 destroy）"
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

env:
  # push 觸發時沒有 inputs，預設 dev
  ENV_NAME: ${{ inputs.environment || 'dev' }}
  AWS_REGION: ap-northeast-1
  TF_DIR: terraform/environments/${{ inputs.environment || 'dev' }}
  TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
  TF_EXTRA_ARGS: ${{ (inputs.environment == 'prod' && inputs.drill) && '-var-file=drill.tfvars' || '' }}
  ECR_REPO: aws-infra-lab-${{ inputs.environment || 'dev' }}-app
  ECS_CLUSTER: aws-infra-lab-${{ inputs.environment || 'dev' }}-cluster
  ECS_SERVICE: aws-infra-lab-${{ inputs.environment || 'dev' }}-app-service
  ALB_NAME: aws-infra-lab-${{ inputs.environment || 'dev' }}-alb

# 同一個環境同一時間只允許一個部署 / 銷毀在跑，避免兩次 apply 互相打架
concurrency:
  group: infra-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  infra:
    name: Infra — terraform apply (${{ inputs.environment || 'dev' }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }} # GitHub Environment：prod 可設定「需人工核准」
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"

      - name: terraform apply
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -auto-approve -input=false -no-color $TF_EXTRA_ARGS

  app:
    name: App — build / push / deploy (${{ inputs.environment || 'dev' }})
    needs: infra # 架構建好之後才部署應用程式
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: 登入 ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPO"
          TAG="${GITHUB_SHA::7}"   # 用 commit hash 前 7 碼當版本號，可追溯是哪一版 code
          docker build -t "$IMAGE:$TAG" -t "$IMAGE:latest" app/
          docker push --all-tags "$IMAGE"
          echo "Pushed image tag: $TAG"
          echo "IMAGE_TAG=$TAG" >> "$GITHUB_ENV"   # 傳給後面的步驟（Job Summary 要用）

      - name: ECS 重新部署
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment > /dev/null
          echo "等待 ECS service 穩定（最多約 10 分鐘）..."
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"

      - name: 健康檢查 /health
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers --names "$ALB_NAME" \
            --query "LoadBalancers[0].DNSName" --output text)
          for i in $(seq 1 10); do
            if curl -fsS "http://$ALB_DNS/health"; then
              echo ""
              echo "✅ 部署成功：http://$ALB_DNS/docs"

              # Job Summary：把網址顯示在執行頁面最上方，不用翻 log
              {
                echo "## 🚀 Deploy 成功（$ENV_NAME）"
                echo ""
                echo "| 項目 | 內容 |"
                echo "|---|---|"
                echo "| API 文件頁 | http://$ALB_DNS/docs |"
                echo "| 健康檢查 | http://$ALB_DNS/health |"
                echo "| Image tag | \`$IMAGE_TAG\`（= commit ${GITHUB_SHA::7}） |"
                echo "| 部署時間 | $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M') (UTC+8) |"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "第 $i 次檢查失敗，15 秒後重試..."
            sleep 15
          done
          echo "❌ 健康檢查失敗，請到 CloudWatch Logs 查看容器 log"
          {
            echo "## ❌ 健康檢查失敗"
            echo ""
            echo "容器沒有在時間內回應 /health。請到 AWS Console → CloudWatch → Log groups → \`/ecs/aws-infra-lab-dev\` 查看錯誤。"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
